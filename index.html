<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#0b1220" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TSGC Field" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=yes" />

    <title>TSGC Field Agent</title>
    <meta
      name="description"
      content="Tri-State Grill Cleaning field agent — identify grills, find parts, build estimates."
    />

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="stylesheet" href="./styles.css" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50:  "#eff6ff",
                100: "#dbeafe",
                500: "#ef6b1a",
                600: "#dc5e15",
                700: "#b94d0f",
              },
              ink: {
                900: "#0b1220",
                800: "#111a2e",
                700: "#1a2540",
                600: "#26324e",
                500: "#3a4666",
                400: "#6c7896",
                300: "#9aa3bf",
                200: "#c8cee0",
                100: "#e6e9f3",
              },
            },
            fontFamily: {
              sans: [
                "ui-sans-serif",
                "system-ui",
                "-apple-system",
                "Segoe UI",
                "Roboto",
                "Inter",
                "sans-serif",
              ],
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-ink-900 text-ink-100 font-sans antialiased min-h-screen">
    <!-- App shell -->
    <div id="app" class="flex flex-col min-h-screen pb-20">
      <header
        id="topbar"
        class="sticky top-0 z-30 bg-ink-900/95 backdrop-blur border-b border-ink-700 px-4 pt-[env(safe-area-inset-top)]"
      >
        <div class="flex items-center justify-between h-14">
          <button
            id="backBtn"
            class="hidden -ml-2 p-2 rounded-lg text-ink-200 active:bg-ink-700"
            aria-label="Back"
          >
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <h1 id="title" class="text-base font-semibold tracking-tight">TSGC Field</h1>
          <button
            id="menuBtn"
            class="-mr-2 p-2 rounded-lg text-ink-200 active:bg-ink-700"
            aria-label="Menu"
          >
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
          </button>
        </div>
      </header>

      <main id="view" class="flex-1 px-4 pt-3"></main>

      <nav
        id="tabbar"
        class="fixed inset-x-0 bottom-0 z-30 bg-ink-800/95 backdrop-blur border-t border-ink-700 pb-[env(safe-area-inset-bottom)]"
      >
        <ul class="grid grid-cols-5 text-[11px]">
          <li><a href="#/jobs" data-tab="jobs" class="tab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18M3 12h18M3 17h18"/></svg>
            Jobs
          </a></li>
          <li><a href="#/parts" data-tab="parts" class="tab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1A2 2 0 1 1 4.3 17l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1A2 2 0 1 1 7 4.3l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
            Parts
          </a></li>
          <li><a href="#/scan" data-tab="scan" class="tab tab-center">
            <span class="tab-fab">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
            </span>
            Scan
          </a></li>
          <li><a href="#/knowledge" data-tab="knowledge" class="tab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
            Tips
          </a></li>
          <li><a href="#/manuals" data-tab="manuals" class="tab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            Manuals
          </a></li>
        </ul>
      </nav>
    </div>

    <!-- Side menu -->
    <div id="menu" class="hidden fixed inset-0 z-40">
      <div class="absolute inset-0 bg-black/50" data-close></div>
      <aside
        class="absolute right-0 top-0 bottom-0 w-72 bg-ink-800 border-l border-ink-700 p-4 pt-[calc(env(safe-area-inset-top)+1rem)] overflow-y-auto"
      >
        <div class="flex items-center gap-2 mb-4">
          <img src="./icon.svg" alt="" class="w-8 h-8 rounded" />
          <div>
            <div class="font-semibold text-ink-100">Tri-State Grill Cleaning</div>
            <div class="text-xs text-ink-300">Field Agent</div>
          </div>
        </div>
        <div class="space-y-1 text-sm">
          <a href="#/jobs" class="menu-link" data-close>All jobs</a>
          <a href="#/jobs/new" class="menu-link" data-close>New job</a>
          <a href="#/parts" class="menu-link" data-close>Parts catalog</a>
          <a href="#/knowledge" class="menu-link" data-close>Troubleshooting</a>
          <a href="#/manuals" class="menu-link" data-close>Service manuals</a>
          <a href="#/settings" class="menu-link" data-close>Settings</a>
        </div>
        <div class="mt-6 pt-4 border-t border-ink-700 text-xs text-ink-400 space-y-1">
          <div>Parts sourced via</div>
          <a
            id="affiliateLink"
            href="https://grillpartsreplacement.com/?ref=zsgtagbs"
            target="_blank"
            rel="noopener"
            class="text-brand-500 font-medium"
          >grillpartsreplacement.com</a>
          <div class="text-ink-500">Affiliate ref: zsgtagbs</div>
        </div>
      </aside>
    </div>

    <!-- Toast -->
    <div id="toast" class="hidden fixed bottom-24 left-1/2 -translate-x-1/2 z-50 bg-ink-700 text-ink-100 px-4 py-2 rounded-full text-sm shadow-lg"></div>

    <script type="module" src="./js/data.js"></script>
    <script type="module" src="./js/app.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
